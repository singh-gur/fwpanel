[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/fwpanel-protocol",
    "crates/fwpanel-service",
]

# Release profile carried over from the original src-tauri profile; member
# profiles are ignored inside a workspace, so this lives at the root.
# panic = "abort" is intentional: a panicking service worker must terminate the
# process (systemd restarts it) rather than continue with suspect EC state.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
