# fwpanel Flatpak manifest: sandboxed, UNPRIVILEGED GUI only.
# The privileged host service (fwpanel-service RPM) stays on the HOST; the
# sandbox talks to it over the granted system-bus name only.
#
# Runtime/tooling pins (verified current 2026-09-10, matching local toolchain):
#   runtime  org.gnome.Platform 49        (WebKitGTK 4.1 included)
#   sdk      org.gnome.Sdk 49
#   rust     org.freedesktop.Sdk.Extension.rust-stable//25.08 (1.98.1)
#   node     org.freedesktop.Sdk.Extension.node24//25.08 (24.20.0)
# Source manifests are generated by generate-sources.sh and committed; the
# build itself runs fully offline.
app-id: io.github.singh-gur.fwpanel
runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable//25.08
  - org.freedesktop.Sdk.Extension.node24//25.08
command: fwpanel

finish-args:
  # Talk to the fwpanel host service only — not the whole system bus.
  - --system-talk-name=io.github.singh_gur.Fwpanel1
  # Display stack actually needed by Tauri/WebKitGTK.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Deliberately absent: --share=network, --socket=system-bus, --device=all,
  # host filesystem access, host command execution, direct EC access.

cleanup:
  - /include
  - /lib/pkgconfig
  - "*.a"

modules:
  - name: fwpanel
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node24/bin
      env:
        CARGO_HOME: /run/build/fwpanel/cargo
        CARGO_NET_OFFLINE: "true"
        # pnpm must not try to reach the network or fetch node headers.
        npm_config_offline: "true"
    build-commands:
      - pnpm install --offline --frozen-lockfile
      - pnpm build
      - cargo build --offline --release --manifest-path src-tauri/Cargo.toml -p fwpanel
      - install -Dm755 target/release/fwpanel /app/bin/fwpanel
      - install -Dm644 packaging/io.github.singh-gur.fwpanel.desktop
          /app/share/applications/io.github.singh-gur.fwpanel.desktop
      - install -Dm644 packaging/io.github.singh-gur.fwpanel.metainfo.xml
          /app/share/metainfo/io.github.singh-gur.fwpanel.metainfo.xml
      - install -Dm644 src-tauri/icons/32x32.png
          /app/share/icons/hicolor/32x32/apps/io.github.singh-gur.fwpanel.png
      - install -Dm644 src-tauri/icons/128x128.png
          /app/share/icons/hicolor/128x128/apps/io.github.singh-gur.fwpanel.png
      - install -Dm644 src-tauri/icons/128x128@2x.png
          /app/share/icons/hicolor/256x256/apps/io.github.singh-gur.fwpanel.png
      - install -Dm644 LICENSE /app/share/licenses/fwpanel/LICENSE
    sources:
      # Application sources (no node_modules/target — checked out explicitly).
      - type: file
        path: package.json
      - type: file
        path: pnpm-lock.yaml
      - type: file
        path: svelte.config.js
      - type: file
        path: vite.config.js
      - type: file
        path: tsconfig.json
      - type: file
        path: LICENSE
      - type: dir
        path: src
      - type: dir
        path: static
      - type: dir
        path: packaging
      - type: file
        path: src-tauri/Cargo.toml
      - type: file
        path: src-tauri/build.rs
      - type: file
        path: src-tauri/tauri.conf.json
      - type: dir
        path: src-tauri/src
      - type: dir
        path: src-tauri/capabilities
      - type: dir
        path: src-tauri/icons
      - type: file
        path: Cargo.toml
      - type: file
        path: Cargo.lock
      - type: dir
        path: crates
      # Pinned offline dependency sources (generated; see generate-sources.sh).
      # node-sources.json also wires the pnpm store and SDK node headers.
      - node-sources.json
      - cargo-sources.json
