# fwpanel Flatpak manifest: sandboxed, UNPRIVILEGED GUI only.
# The privileged host service (fwpanel-service RPM) stays on the HOST; the
# sandbox talks to it over the granted system-bus name only.
#
# Runtime/tooling pins (verified current 2026-09-10, matching local toolchain):
#   runtime  org.gnome.Platform 49        (WebKitGTK 4.1 included)
#   sdk      org.gnome.Sdk 49
#   rust     org.freedesktop.Sdk.Extension.rust-stable//25.08 (1.98.1)
#   node     org.freedesktop.Sdk.Extension.node24//25.08 (24.20.0)
# Source manifests are generated by generate-sources.sh and committed; the
# build itself runs fully offline.
app-id: io.github.singh_gur.fwpanel
# Flatpak ids reject dashes outside the last segment, so the desktop/AppStream
# identity uses underscores here (the RPM keeps io.github.singh-gur.fwpanel;
# the D-Bus service name already uses the underscore form).
runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node24
command: fwpanel

finish-args:
  # Talk to the fwpanel host service only — not the whole system bus.
  - --system-talk-name=io.github.singh_gur.Fwpanel1
  # Display stack actually needed by Tauri/WebKitGTK.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Deliberately absent: --share=network, --socket=system-bus, --device=all,
  # host filesystem access, host command execution, direct EC access.

cleanup:
  - /include
  - /lib/pkgconfig
  - "*.a"

modules:
  - name: fwpanel
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node24/bin
      env:
        CARGO_HOME: /run/build/fwpanel/cargo
        CARGO_NET_OFFLINE: "true"
        # pnpm must not try to reach the network or fetch node headers.
        npm_config_offline: "true"
    build-commands:
      - tar xzf pnpm-exe.tgz
      - ./package/pnpm install --offline --frozen-lockfile --trust-lockfile
      - ./package/pnpm build
      - cargo build --offline --release --manifest-path src-tauri/Cargo.toml -p fwpanel
      - install -Dm755 target/release/fwpanel /app/bin/fwpanel
      - install -Dm644 packaging/flatpak/io.github.singh_gur.fwpanel.desktop
          /app/share/applications/io.github.singh_gur.fwpanel.desktop
      - install -Dm644 packaging/flatpak/io.github.singh_gur.fwpanel.metainfo.xml
          /app/share/metainfo/io.github.singh_gur.fwpanel.metainfo.xml
      - install -Dm644 src-tauri/icons/32x32.png
          /app/share/icons/hicolor/32x32/apps/io.github.singh_gur.fwpanel.png
      - install -Dm644 src-tauri/icons/128x128.png
          /app/share/icons/hicolor/128x128/apps/io.github.singh_gur.fwpanel.png
      - install -Dm644 src-tauri/icons/128x128@2x.png
          /app/share/icons/hicolor/256x256/apps/io.github.singh_gur.fwpanel.png
      - install -Dm644 LICENSE /app/share/licenses/fwpanel/LICENSE
    sources:
      # One local git checkout preserves the workspace layout and excludes
      # node_modules/target automatically (git-tracked files only).
      - type: git
        url: ../..
        branch: HEAD
      # Pinned pnpm executable: the node24 SDK extension ships node/npm but
      # not pnpm; the pnpm npm package is a thin launcher that fetches the
      # native binary, so the native @pnpm/exe tarball is the build input.
      - type: file
        url: https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-12.3.4.tgz
        sha512: d99a8e9523e47f05f5879711f853e259ff3e17eda1653ff74ef8542b9b22807ab06900888aaf11ec21b186774ab3adc9b5c2e2d9ad50a68fb05ff128c9f8f225
        dest-filename: pnpm-exe.tgz
      # Pinned offline dependency sources (generated; see generate-sources.sh).
      # node-sources.json also wires the pnpm store and SDK node headers.
      - node-sources.json
      - cargo-sources.json
