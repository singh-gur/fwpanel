<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root may own the fwpanel service name. -->
  <policy user="root">
    <allow own="io.github.singh_gur.Fwpanel1"/>
  </policy>

  <!-- Anyone may send to the application interface; the service itself
       authorizes each method per caller via polkit. -->
  <policy context="default">
    <allow send_destination="io.github.singh_gur.Fwpanel1"
           send_interface="io.github.singh_gur.Fwpanel1"/>
  </policy>
</busconfig>
